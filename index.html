<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Documento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="boxes">
        <div class="box contactos">
            <div class="estado-usuario">
                <div class="datos-usuario">
                    <img src="./assets/images/maria.jpg" alt="">
                    <div class="datos">
                        <h1 class="open-sans-small">
                            Maria
                        </h1>
                        <p class="open-sans-xsmall">
                            Activo ahora
                        </p>

                    </div>
                </div>
                <div class="icon">
                    <i class="fa-regular fa-message fa-2x"></i>
                    <i class="fa-solid fa-bars fa-2x"></i>
                </div>
            </div>
            <div class="nuevo-chat open-sans-regular">
                <button class="boton-chat">
                    Nuevo Chat
                </button>


    
            </div>
            <div class="chat-contacto">

            </div>
        </div>
        <div class="box contenido">
            <img src="./assets/images/hand.png" alt="icono">
            <h1 class="roboto-bold">
                Comienza el Networking
            </h1>
            <p class="open-sans-regular">
                Presiona el botón <strong>"Nuevo chat"</strong>  para comenzar a crear nuevas redes de contacto para tu empresa o emprendimiento.
            </p>
        </div>
    </div>
    

    <script src="https://kit.fontawesome.com/f9d196a74f.js" crossorigin="anonymous"></script>
</body>

</html>
